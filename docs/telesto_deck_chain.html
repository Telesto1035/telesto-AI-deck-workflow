  <text x="291" y="350" font-size="11.5" text-anchor="middle" fill="#FFFFFF">room → questions → data map</text>
  <text x="291" y="395" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Offered by pop-up at Build and mid-stream entry.</text>

  <text x="598" y="442" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Core three per page: title and message, exhibit, recommendation.</text>
  <text x="598" y="457" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Principles + capped house register + client file. Storyline confirmed in text first.</text>
  <text x="598" y="472" font-size="11.5" text-anchor="middle" fill="#FFFFFF">Contact-sheet render before handoff; every stage ends with the next-stage line.</text>
